<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Painel Ressaca - Portaria</title>
    <style>
        /* Tema de Alto Contraste (Inversão) */
        .theme-light { background-color: #ffffff !important; color: #000000 !important; }
        .theme-light .bg-gray-800 { background-color: #e5e7eb !important; color: #000000 !important; }
        .theme-light .text-white { color: #000000 !important; }
        .theme-light .text-gray-400 { color: #4b5563 !important; }
    </style>
</head>
<body id="pageBody" class="bg-gray-700 min-h-screen p-8 text-white transition-colors duration-300">

    <button id="playBtn" onclick="togglePlay()" 
        class="fixed top-6 right-20 w-16 h-16 rounded-full bg-gradient-to-br from-gray-400 to-gray-600 border border-white/10 shadow-[0_8px_15px_rgba(0,0,0,0.5)] active:translate-y-1 active:shadow-none transition-all z-50 flex items-center justify-center">
        <span id="playIcon" class="text-3xl text-white">▶</span>
    </button>

    <div class="fixed right-6 top-6 flex flex-col gap-2 bg-black/20 p-2 rounded-full z-50">
        <button onclick="mudarCor('#374151')" class="w-5 h-5 rounded-full bg-gray-700"></button>
        <button onclick="mudarCor('#1e3a8a')" class="w-5 h-5 rounded-full bg-blue-900"></button>
        <button onclick="mudarCor('#065f46')" class="w-5 h-5 rounded-full bg-green-900"></button>
        <button onclick="document.body.classList.toggle('theme-light')" class="w-5 h-5 rounded-full bg-white border border-black"></button>
    </div>

    <a href="#" class="fixed bottom-8 left-8 bg-green-500 p-6 rounded-full shadow-[0_10px_20px_rgba(0,0,0,0.3)] z-50 hover:scale-105 transition-all">💬</a>

    <header class="max-w-6xl mx-auto mb-8 text-center">
        <h1 class="text-3xl font-bold uppercase tracking-widest">ASSOCIAÇÃO MORADORES BAIRRO RESSACA 🏄‍♂️</h1>
    </header>

    <div class="max-w-6xl mx-auto flex gap-6">
        
        <div class="w-1/3 flex flex-col gap-4">
            <button class="bg-blue-600 p-6 rounded-2xl font-bold text-lg hover:bg-blue-700 transition">+ NOVA ENCOMENDA</button>
            <button class="bg-gray-600 p-6 rounded-2xl font-bold text-lg hover:bg-gray-700 transition">+ CADASTRAR USUÁRIO</button>
        </div>

        <div class="w-2/3 bg-gray-800 p-6 rounded-2xl shadow-xl">
            <div class="mb-6 flex items-center bg-gray-900 px-4 py-3 rounded-xl border border-white/10">
                <span class="mr-3">🔍</span>
                <input type="text" placeholder="Pesquisar..." class="bg-transparent outline-none w-full">
            </div>

            <table class="w-full text-left">
                <thead class="text-gray-400 text-xs uppercase border-b border-white/10">
                    <tr>
                        <th class="pb-3">Unid</th>
                        <th class="pb-3">Logradouro</th>
                        <th class="pb-3">Status</th>
                        <th class="pb-3">Chegada</th>
                        <th class="pb-3">Código</th>
                        <th class="pb-3">Ação</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-white/10">
                    <tr class="text-sm">
                        <td class="py-4 font-bold">103</td>
                        <td class="py-4">R. Pescada</td>
                        <td class="py-4 text-green-400 font-bold">Pendente</td>
                        <td class="py-4 text-gray-300">29/05</td>
                        <td class="py-4 font-mono">PCP-88</td>
                        <td class="py-4"><button class="bg-green-600 px-4 py-1.5 rounded-lg font-bold hover:bg-green-700">Entregar</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function mudarCor(cor) { document.getElementById('pageBody').style.backgroundColor = cor; }
        function togglePlay() { const icon = document.getElementById('playIcon'); icon.innerText = (icon.innerText === '▶' ? '⏸' : '▶'); }
    </script>
</body>
</html>
