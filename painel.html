<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Painel Ressaca - Portaria</title>
</head>
<body id="pageBody" class="min-h-screen p-4 md:p-8 text-white transition-all duration-300 bg-gray-800 bg-cover bg-center">

    <audio id="audioPlayer" loop><source src="https://stream.eldorado.fm/eldorado" type="audio/mpeg"></audio>

    <div id="modalEncomenda" class="hidden fixed inset-0 z-[100] bg-black/60 flex items-center justify-center p-4">
        <div class="bg-gray-900 p-8 rounded-2xl w-full max-w-md border border-white/10">
            <h2 class="text-xl font-bold mb-4">Nova Encomenda</h2>
            <input type="text" id="in-cod" placeholder="Código" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none text-white">
            <input type="text" id="in-morador-nome" placeholder="Nome do Morador" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none text-white">
            <input type="text" id="in-endereco" placeholder="Endereço" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none text-white">
            <input type="text" id="in-empresa" placeholder="Empresa" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none text-white">
            <input type="text" id="in-tipo" placeholder="Tipo" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none text-white">
            <input type="file" id="in-foto" accept="image/*" capture="environment" class="w-full p-3 mb-4 bg-gray-800 rounded-lg text-sm text-gray-400">
            <div class="flex gap-2">
                <button id="btnSalvarEncomenda" class="flex-1 bg-green-600 p-3 rounded-lg font-bold hover:bg-green-700">Salvar</button>
                <button onclick="document.getElementById('modalEncomenda').classList.add('hidden')" class="flex-1 bg-red-600 p-3 rounded-lg hover:bg-red-700">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalEntrega" class="hidden fixed inset-0 z-[100] bg-black/60 flex items-center justify-center p-4">
        <div class="bg-gray-900 p-8 rounded-2xl w-full max-w-sm border border-white/10">
            <h2 class="text-xl font-bold mb-4">Confirmar Entrega</h2>
            <input type="text" id="in-recebedor" placeholder="Nome do Recebedor" class="w-full p-3 mb-4 bg-gray-800 rounded-lg outline-none text-white">
            <div class="flex gap-2">
                <button id="btnConfirmarEntrega" class="flex-1 bg-green-600 p-3 rounded-lg font-bold hover:bg-green-700">Confirmar</button>
                <button onclick="document.getElementById('modalEntrega').classList.add('hidden')" class="flex-1 bg-red-600 p-3 rounded-lg hover:bg-red-700">Voltar</button>
            </div>
        </div>
    </div>

    <header class="max-w-6xl mx-auto mb-8 text-center relative">
        <h1 class="text-3xl font-bold uppercase tracking-widest pt-4">ASSOCIAÇÃO MORADORES BAIRRO RESSACA 🏄‍♂️</h1>
    </header>

    <div class="max-w-6xl mx-auto flex flex-col md:flex-row gap-6">
        
        <div class="w-full md:w-1/3 flex flex-col gap-4">
            
            <button onclick="togglePlay()" class="bg-blue-600 p-6 rounded-2xl font-bold flex items-center justify-center gap-3 shadow-lg hover:bg-blue-700 transition">
                <span id="playIcon" class="text-xl">▶</span> OUVIR RÁDIO
            </button>

            <button onclick="document.getElementById('modalEncomenda').classList.remove('hidden')" class="bg-blue-600 p-6 rounded-2xl font-bold shadow-lg hover:bg-blue-700 transition">+ NOVA ENCOMENDA</button>
            <button onclick="alert('Funcionalidade de cadastro')" class="bg-slate-600 p-6 rounded-2xl font-bold shadow-lg hover:bg-slate-700 transition">+ CADASTRAR USUÁRIO</button>
            <button onclick="alert('Configurações')" class="bg-orange-500 p-6 rounded-2xl font-bold shadow-lg hover:bg-orange-600 transition">⚙ CONFIGURAÇÕES</button>
            <button onclick="carregarHistorico()" class="bg-magenta-700 p-6 rounded-2xl font-bold shadow-lg bg-fuchsia-700 hover:bg-fuchsia-800 transition">📜 HISTÓRICO DE ENTREGAS</button>
            
            <div class="bg-gray-800/90 p-4 rounded-2xl flex flex-col gap-2 items-center justify-center border border-white/10 shadow-lg">
                <span class="text-xs text-gray-400 font-bold uppercase tracking-wider">Mudar Fundo</span>
                <div class="flex gap-3 justify-center items-center mt-1">
                    <button onclick="mudarCor('cinza')" class="w-8 h-8 rounded-full bg-gray-800 border-2 border-white hover:scale-110 transition shadow-md" title="Padrão Cinza"></button>
                    <button onclick="mudarCor('marrom')" class="w-8 h-8 rounded-full bg-[#A04000] border-2 border-white hover:scale-110 transition shadow-md" title="Marrom"></button>
                    <button onclick="mudarCor('azul')" class="w-8 h-8 rounded-full bg-blue-900 border-2 border-white hover:scale-110 transition shadow-md" title="Azul"></button>
                    <button onclick="mudarCor('foto')" class="w-8 h-8 rounded-full border-2 border-white bg-cover bg-center hover:scale-110 transition shadow-md relative" style="background-image: url('ubatuba.jpg');" title="Fundo Foto Ubatuba">
                        <span class="absolute inset-0 flex items-center justify-center text-[10px] bg-black/20 rounded-full font-bold">🏝</span>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="w-full md:w-2/3 flex flex-col gap-6">
            
            <div class="bg-gray-900/90 p-6 rounded-2xl shadow-2xl border border-white/10">
                <table class="w-full text-left border-collapse">
                    <thead class="text-gray-400 text-xs uppercase border-b border-white/10">
                        <tr>
                            <th class="pb-3 font-semibold">Foto</th>
                            <th class="pb-3 font-semibold">Morador</th>
                            <th class="pb-3 font-semibold">Endereço</th>
                            <th class="pb-3 font-semibold">Empresa</th>
                            <th class="pb-3 font-semibold">Tipo</th>
                            <th class="pb-3 font-semibold">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaEncomendas" class="divide-y divide-white/10"></tbody>
                </table>
            </div>

            <div id="areaHistorico" class="bg-[#A04000]/95 p-6 rounded-2xl border border-white/10 shadow-2xl hidden transition-all">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2">📜 Histórico de Entregas Recentes</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead class="text-white/70 uppercase border-b border-white/20">
                            <tr>
                                <th class="pb-2 font-semibold">Foto</th>
                                <th class="pb-2 font-semibold">Morador/Endereço</th>
                                <th class="pb-2 font-semibold">Empresa/Tipo</th>
                                <th class="pb-2 font-semibold">Recebedor</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaHistoricoCorpo" class="divide-y divide-white/10"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./logica.js"></script>
</body>
</html>
