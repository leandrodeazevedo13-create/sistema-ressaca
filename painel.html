<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>Painel Ressaca</title>
</head>
<body class="bg-[#A04000] text-white min-h-screen">
    <div class="max-w-6xl mx-auto p-6">
        <header class="mb-8 text-center">
            <h1 class="text-2xl font-bold uppercase tracking-widest">ASSOCIAÇÃO MORADORES BAIRRO RESSACA</h1>

        <div class="flex gap-6">

        </div>

    <div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
        <div class="bg-gray-900 p-6 rounded-2xl w-80">
            <input type="text" id="in-unid" placeholder="Unidade" class="w-full p-2 mb-2 bg-gray-800 rounded">

            <input type="text" id="in-cod" placeholder="Código" class="w-full p-2 mb-4 bg-gray-800 rounded">
            <button onclick="salvar()" class="w-full bg-green-600 p-2 rounded">Salvar</button>
        </div>
    </div>

    if (typeof window.supabaseClient === 'undefined') {
        window.supabaseClient = supabase.createClient(
            'https://oreltmkohfzptelcqmau.supabase.co', 
            'SUA_CHAVE_ANON_AQUI'
        );
    }

    async function carregarEncomendas() {
        const { data, error } = await window.supabaseClient.from('encomendas').select('*');
        if (error) { console.error(error); return; }

</script>
</body>
</html>
