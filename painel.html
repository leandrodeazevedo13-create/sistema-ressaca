<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>Painel Ressaca - Portaria</title>
</head>
<body class="bg-[#A04000] min-h-screen p-8 text-white">

    <div id="modal" class="hidden fixed inset-0 z-[100] bg-black/60 flex items-center justify-center p-4">
        <div class="bg-gray-900 p-8 rounded-2xl w-full max-w-sm border border-white/10">
            <h2 class="text-xl font-bold mb-4">Nova Encomenda</h2>
            <input type="text" id="in-unid" placeholder="Unidade" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none">
            <input type="text" id="in-log" placeholder="Logradouro" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none">
            <input type="text" id="in-emp" placeholder="Empresa" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none">
            <input type="text" id="in-cod" placeholder="Código" class="w-full p-3 mb-4 bg-gray-800 rounded-lg outline-none">
            <div class="flex gap-2">
                <button onclick="salvarEncomenda()" class="flex-1 bg-green-600 p-3 rounded-lg font-bold">Salvar</button>
                <button onclick="fecharModal()" class="flex-1 bg-red-600 p-3 rounded-lg font-bold">Cancelar</button>
            </div>
        </div>
    </div>

    <button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-blue-600 p-6 rounded-2xl font-bold mb-6">+ NOVA ENCOMENDA</button>
    <div class="bg-gray-800 p-6 rounded-2xl w-2/3">
        <table class="w-full text-left">
            <thead><tr class="text-gray-400 border-b border-white/10"><th class="pb-3">Unid</th><th class="pb-3">Logradouro</th><th class="pb-3">Empresa</th><th class="pb-3">Cod</th></tr></thead>
            <tbody id="tabelaEncomendas"></tbody>
        </table>
    </div>

    <script>
    // Conexão direta para garantir que funcione em produção e local
    const supabase = supabase.createClient(
        'https://oreltmkohfzptelcqmau.supabase.co', 
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9yZWx0bWtvaGZ6cHRlbGNxbWF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTc0NTMsImV4cCI6MjA5NTY3MzQ1M30.cZUui1XdJ1m1qwivtDiR_3-byxnLU5ZwHffSv2tyrCQ' // <--- Substitua aqui pela chave real
    );

    async function carregarEncomendas() {
        const { data, error } = await supabase.from('encomendas').select('*');
        if (error) { 
            console.error("Erro ao buscar dados:", error); 
            return; 
        }
        
        const tabela = document.getElementById('tabelaEncomendas');
        tabela.innerHTML = ''; // Limpa antes de carregar
        
        data.forEach(item => {
            tabela.innerHTML += `<tr>
                <td>${item.unidade}</td>
                <td>${item.logradouro}</td>
                <td>${item.empresa}</td>
                <td>${item.codigo}</td>
            </tr>`;
        });
    }

    carregarEncomendas();
</script>
</body>
</html>
