<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>Painel Ressaca - Portaria</title>
    <style>
        .theme-light { background-color: #ffffff !important; color: #000000 !important; }
        .theme-light .bg-gray-800 { background-color: #e5e7eb !important; color: #000000 !important; }
        .theme-light .text-white { color: #000000 !important; }
        .theme-light .text-gray-400 { color: #4b5563 !important; }
        .theme-light .bg-gray-900 { background-color: #d1d5db !important; }
    </style>
</head>
<body id="pageBody" class="bg-[#A04000] min-h-screen p-8 text-white transition-colors duration-300">

    <div id="modal" class="hidden fixed inset-0 z-[100] bg-black/60 flex items-center justify-center p-4">
        <div class="bg-gray-900 p-8 rounded-2xl w-full max-w-sm border border-white/10">
            <h2 class="text-xl font-bold mb-4">Nova Encomenda</h2>
            <input type="text" id="in-unid" placeholder="Unidade" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none">
            <input type="text" id="in-log" placeholder="Logradouro" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none">
            <input type="text" id="in-emp" placeholder="Empresa" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none">
            <input type="text" id="in-cod" placeholder="Código" class="w-full p-3 mb-4 bg-gray-800 rounded-lg outline-none">
            <div class="flex gap-2">
                <button onclick="salvarEncomenda()" class="flex-1 bg-green-600 p-3 rounded-lg font-bold">Salvar</button>
                <button onclick="document.getElementById('modal').classList.add('hidden')" class="flex-1 bg-red-600 p-3 rounded-lg font-bold">Cancelar</button>
            </div>
        </div>
    </div>

    <div class="fixed top-6 left-8 z-50">
        <div id="relogio" class="text-3xl font-mono font-bold tracking-widest drop-shadow-lg">00:00:00</div>
        <div id="data" class="text-xs uppercase tracking-widest opacity-80">--/--/----</div>
    </div>

    <button id="playBtn" onclick="togglePlay()" class="fixed top-6 right-20 w-16 h-16 rounded-full bg-gradient-to-br from-gray-400 to-gray-600 border border-white/10 shadow-[0_8px_15px_rgba(0,0,0,0.5)] z-50 flex items-center justify-center">
        <span id="playIcon" class="text-3xl">▶</span>
    </button>

    <div class="fixed right-6 top-6 flex flex-col gap-1.5 bg-black/20 p-2 rounded-full z-50">
        <button onclick="mudarCor('#A04000')" class="w-5 h-5 rounded-full bg-[#A04000]"></button>
        <button onclick="mudarCor('#374151')" class="w-5 h-5 rounded-full bg-gray-700"></button>
        <button onclick="mudarCor('#1e3a8a')" class="w-5 h-5 rounded-full bg-blue-900"></button>
        <button onclick="mudarCor('#065f46')" class="w-5 h-5 rounded-full bg-green-900"></button>
        <button onclick="mudarCor('#581c87')" class="w-5 h-5 rounded-full bg-purple-900"></button>
        <button onclick="mudarCor('#9f1239')" class="w-5 h-5 rounded-full bg-rose-900"></button>
        <button onclick="mudarCor('#115e59')" class="w-5 h-5 rounded-full bg-teal-900"></button>
        <button onclick="document.body.classList.toggle('theme-light')" class="w-5 h-5 rounded-full bg-white border border-black"></button>
    </div>

    <header class="max-w-6xl mx-auto mb-8 text-center">
        <h1 class="text-3xl font-bold uppercase tracking-widest">ASSOCIAÇÃO MORADORES BAIRRO RESSACA 🏄‍♂️</h1>
    </header>

    <div class="max-w-6xl mx-auto flex gap-6">
        <div class="w-1/3 flex flex-col gap-4">
            <button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-blue-600 p-6 rounded-2xl font-bold hover:bg-blue-700 transition">+ NOVA ENCOMENDA</button>
            <button class="bg-gray-600 p-6 rounded-2xl font-bold hover:bg-gray-700 transition">+ CADASTRAR USUÁRIO</button>
            <button class="bg-amber-600 p-4 rounded-2xl font-bold hover:bg-amber-700 transition text-sm">⚙️ CONFIGURAÇÕES / ALTERAR CADASTRO</button>
            
            <div class="bg-black/20 p-6 rounded-2xl border border-white/10">
                <h3 class="text-xs uppercase text-gray-400 mb-4 font-bold">Total por Categoria</h3>
                <div class="grid grid-cols-2 gap-3 text-center text-xs">
                    <div class="bg-white/5 p-2 rounded">PCP: 12</div>
                    <div class="bg-white/5 p-2 rounded">PC: 08</div>
                    <div class="bg-white/5 p-2 rounded">CXP: 05</div>
                    <div class="bg-white/5 p-2 rounded">CX: 15</div>
                </div>
            </div>
        </div>

        <div class="w-2/3 bg-gray-800 p-6 rounded-2xl shadow-xl">
            <div class="mb-6 flex items-center bg-gray-900 px-4 py-3 rounded-xl border border-white/10">
                <input type="text" placeholder="Pesquisar..." class="bg-transparent outline-none w-full">
            </div>
            <div class="max-h-[500px] overflow-y-auto">
                <table class="w-full text-left">
                    <thead class="text-gray-400 text-xs uppercase border-b border-white/10 sticky top-0 bg-gray-800">
                        <tr><th class="pb-3">Unid</th><th class="pb-3">Logradouro</th><th class="pb-3">Empresa</th><th class="pb-3">Cod</th><th class="pb-3">Ação</th></tr>
                    </thead>
                    <tbody id="tabelaEncomendas" class="divide-y divide-white/10"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const supabase = supabase.createClient('https://oreltmkohfzptelcqmau.supabase.co', 'sb_publishable_IwPZ6Y8Mr6RnwQLE24oY1Q_EiIpxUEQ');

        // Relógio
        setInterval(() => {
            const agora = new Date();
            document.getElementById('relogio').innerText = agora.toLocaleTimeString();
            document.getElementById('data').innerText = agora.toLocaleDateString();
        }, 1000);

        // Lógica Supabase
        async function carregarEncomendas() {
            const { data } = await supabase.from('encomendas').select('*').eq('status', 'pendente');
            const corpo = document.getElementById('tabelaEncomendas');
            corpo.innerHTML = '';
            if(data) {
                data.forEach(item => {
                    corpo.innerHTML += `<tr class="text-xs">
                        <td class="py-3 font-bold">${item.unidade}</td>
                        <td class="py-3">${item.logradouro}</td>
                        <td class="py-3 text-yellow-400">📦 ${item.empresa}</td>
                        <td class="py-3 font-mono">${item.codigo}</td>
                        <td class="py-3"><button onclick="entregar('${item.id}')" class="bg-green-600 px-3 py-1 rounded-lg">Entregar</button></td>
                    </tr>`;
                });
            }
        }

        async function salvarEncomenda() {
            await supabase.from('encomendas').insert([{
                unidade: document.getElementById('in-unid').value,
                logradouro: document.getElementById('in-log').value,
                empresa: document.getElementById('in-emp').value,
                codigo: document.getElementById('in-cod').value,
                status: 'pendente'
            }]);
            document.getElementById('modal').classList.add('hidden');
            carregarEncomendas();
        }

        async function entregar(id) {
            await supabase.from('encomendas').update({ status: 'entregue' }).eq('id', id);
            carregarEncomendas();
        }

        function mudarCor(c) { document.getElementById('pageBody').style.backgroundColor = c; }
        function togglePlay() { const icon = document.getElementById('playIcon'); icon.innerText = (icon.innerText === '▶' ? '⏸' : '▶'); }

        carregarEncomendas();
    // Teste de conexão imediato
supabase.from('encomendas').select('*').limit(1)
    .then(res => {
        if (res.error) {
            console.error("ERRO NO SUPABASE:", res.error);
            alert("Erro ao conectar no banco! Veja o Console (F12).");
        } else {
            console.log("SUCESSO! Conectado ao banco.", res.data);
        }
    });
    </script>
</body>
</html>
