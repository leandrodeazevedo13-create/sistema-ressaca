<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Painel Ressaca - Portaria</title>
    <style>
        .theme-light { background-color: #ffffff !important; color: #000000 !important; }
        .theme-light .bg-gray-800 { background-color: #e5e7eb !important; color: #000000 !important; }
        .theme-light .text-white { color: #000000 !important; }
        .theme-light .bg-gray-900 { background-color: #d1d5db !important; }
    </style>
</head>
<body id="pageBody" class="bg-[#A04000] min-h-screen p-8 text-white transition-colors duration-300">

    <!-- Modal Nova Encomenda (Com Upload de Foto) -->
<div id="modalEncomenda" class="hidden fixed inset-0 z-[100] bg-black/60 flex items-center justify-center p-4">
    <div class="bg-gray-900 p-8 rounded-2xl w-full max-w-sm border border-white/10">
        <h2 class="text-xl font-bold mb-4">Nova Encomenda</h2>
        <input type="text" id="in-unid" placeholder="Unidade" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none">
        <input type="text" id="in-log" placeholder="Logradouro" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none">
        <input type="text" id="in-emp" placeholder="Empresa" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none">
        <input type="file" id="in-foto" class="w-full p-3 mb-4 bg-gray-800 rounded-lg outline-none text-sm">
        <div class="flex gap-2">
            <button id="btnSalvar" class="flex-1 bg-green-600 p-3 rounded-lg font-bold">Salvar</button>
            <button onclick="document.getElementById('modalEncomenda').classList.add('hidden')" class="flex-1 bg-red-600 p-3 rounded-lg font-bold">Cancelar</button>
        </div>
    </div>
</div>

<!-- Modal Usuário -->
<div id="modalUsuario" class="hidden fixed inset-0 z-[100] bg-black/60 flex items-center justify-center p-4">
    <div class="bg-gray-900 p-8 rounded-2xl w-full max-w-sm border border-white/10">
        <h2 class="text-xl font-bold mb-4">Gerenciar Usuário</h2>
        <input type="text" id="in-nome" placeholder="Nome do Usuário" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none">
        <input type="password" id="in-senha" placeholder="Senha" class="w-full p-3 mb-4 bg-gray-800 rounded-lg outline-none">
        <div class="flex gap-2">
            <button id="btnSalvarUsuario" class="flex-1 bg-blue-600 p-3 rounded-lg font-bold">Salvar Usuário</button>
            <button onclick="document.getElementById('modalUsuario').classList.add('hidden')" class="flex-1 bg-red-600 p-3 rounded-lg font-bold">Fechar</button>
        </div>
    </div>
</div>

    <script type="module" src="./logica.js"></script>
</body>
</html>
