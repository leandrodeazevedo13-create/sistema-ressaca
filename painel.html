<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Painel Ressaca - Portaria</title>
</head>
<body id="pageBody" class="min-h-screen p-4 md:p-8 text-white transition-all duration-300 bg-gray-900 bg-cover bg-center" style="background-image: url('ubatuba.jpg');">

    <audio id="audioPlayer" loop><source src="https://stream.eldorado.fm/eldorado" type="audio/mpeg"></audio>

    <!-- CONTROLES FLUTUANTES (Canto Superior Direito - Igual ao seu print original) -->
    <div class="fixed top-6 right-6 flex flex-col items-center gap-4 z-50">
        <!-- Botão Rádio Quadrado Pequeno -->
        <button onclick="togglePlay()" class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg hover:bg-blue-700 transition border border-white/10">
            <span id="playIcon" class="text-xl text-white">▶</span>
        </button>
        
        <!-- Opções de Cores na Vertical abaixo do Rádio -->
        <div class="flex flex-col gap-2 bg-black/40 p-2 rounded-full backdrop-blur-sm border border-white/10">
            <button onclick="mudarCor('cinza')" class="w-6 h-6 rounded-full bg-gray-800 border-2 border-white/40 hover:border-white transition"></button>
            <button onclick="mudarCor('marrom')" class="w-6 h-6 rounded-full bg-[#A04000] border-2 border-white/40 hover:border-white transition"></button>
            <button onclick="mudarCor('azul')" class="w-6 h-6 rounded-full bg-blue-900 border-2 border-white/40 hover:border-white transition"></button>
            <button onclick="mudarCor('foto')" class="w-6 h-6 rounded-full border-2 border-white/40 hover:border-white bg-cover bg-center transition" style="background-image: url('ubatuba.jpg');"></button>
        </div>
    </div>

    <!-- Modal Nova Encomenda -->
    <div id="modalEncomenda" class="hidden fixed inset-0 z-[100] bg-black/60 flex items-center justify-center p-4">
        <div class="bg-gray-900 p-8 rounded-2xl w-full max-w-md border border-white/10">
            <h2 class="text-xl font-bold mb-4">📦 Nova Encomenda</h2>
            
            <!-- Campo de Código de Barras com Scanner -->
            <div class="mb-4">
                <label class="text-xs text-gray-400 uppercase">Código (ou Escaneie)</label>
                <div class="flex gap-2">
                    <input type="text" id="in-cod" placeholder="Código/Barras" autofocus 
                           class="flex-1 p-3 bg-gray-800 rounded-lg outline-none text-white border border-white/10 focus:border-blue-500">
                    <button id="btnAtivarScanner" class="bg-purple-600 px-4 py-3 rounded-lg hover:bg-purple-700 transition font-bold" title="Ativar leitor de código de barras">
                        📱
                    </button>
                </div>
            </div>
            
            <input type="text" id="in-morador-nome" placeholder="Nome do Morador" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none text-white border border-white/10 focus:border-blue-500">
            <input type="text" id="in-endereco" placeholder="Endereço" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none text-white border border-white/10 focus:border-blue-500">
            <input type="text" id="in-empresa" placeholder="Empresa" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none text-white border border-white/10 focus:border-blue-500">
            <select id="in-tipo" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none text-white border border-white/10 focus:border-blue-500">
                <option value="Normal">Normal</option>
                <option value="Frágil">Frágil</option>
                <option value="Urgente">Urgente</option>
                <option value="Documento">Documento</option>
                <option value="Outro">Outro</option>
            </select>
            <input type="file" id="in-foto" accept="image/*" capture="environment" class="w-full p-3 mb-4 bg-gray-800 rounded-lg text-sm text-gray-400 border border-white/10">
            
            <div class="flex gap-2">
                <button id="btnSalvarEncomenda" class="flex-1 bg-green-600 p-3 rounded-lg font-bold hover:bg-green-700 transition">✅ Salvar</button>
                <button onclick="document.getElementById('modalEncomenda').classList.add('hidden')" class="flex-1 bg-red-600 p-3 rounded-lg hover:bg-red-700 transition font-bold">❌ Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal Confirmar Entrega (Layout exato do print image_5c7559.png) -->
    <div id="modalEntrega" class="hidden fixed inset-0 z-[100] bg-black/60 flex items-center justify-center p-4">
        <div class="bg-gray-950 p-8 rounded-2xl w-full max-w-sm border border-white/10 shadow-2xl">
            <h2 class="text-xl font-bold mb-4 text-white">✅ Confirmar Entrega</h2>
            <input type="text" id="in-recebedor" placeholder="Nome do Recebedor (obrigatório)" 
                   class="w-full p-3 mb-6 bg-gray-900 rounded-lg outline-none text-white border border-white/5 focus:border-green-500 focus:border-2">
            <div class="flex gap-3">
                <button id="btnConfirmarEntrega" class="flex-1 bg-emerald-600 p-3 rounded-lg font-bold hover:bg-emerald-700 transition">✓ Confirmar</button>
                <button onclick="document.getElementById('modalEntrega').classList.add('hidden')" class="flex-1 bg-red-600 p-3 rounded-lg font-bold hover:bg-red-700 transition">✕ Voltar</button>
            </div>
        </div>
    </div>

    <header class="max-w-6xl mx-auto mb-8 text-center">
        <h1 class="text-3xl font-bold uppercase tracking-widest pt-4">ASSOCIAÇÃO MORADORES BAIRRO RESSACA 🏄‍♂️</h1>
    </header>

    <div class="max-w-6xl mx-auto flex flex-col md:flex-row gap-6">
        <!-- MENU LATERAL ESQUERDO -->
        <div class="w-full md:w-1/3 flex flex-col gap-4">
            <button onclick="document.getElementById('modalEncomenda').classList.remove('hidden')" class="bg-blue-600 p-6 rounded-2xl font-bold shadow-lg text-left pl-8 hover:bg-blue-700 transition">+ NOVA ENCOMENDA</button>
            <button onclick="alert('Cadastro')" class="bg-slate-700 p-6 rounded-2xl font-bold shadow-lg text-left pl-8 hover:bg-slate-600 transition">+ CADASTRAR USUÁRIO</button>
            <button onclick="alert('Configurações')" class="bg-orange-600 p-6 rounded-2xl font-bold shadow-lg text-left pl-8 hover:bg-orange-700 transition">⚙ CONFIGURAÇÕES</button>
            <button onclick="carregarHistorico()" class="bg-fuchsia-700 p-6 rounded-2xl font-bold shadow-lg text-left pl-8 hover:bg-fuchsia-800 transition">📜 HISTÓRICO DE ENTREGAS</button>
            
            <!-- Mudar Fundo na parte inferior interna se quiser manter redundância -->
            <div class="bg-gray-900/40 p-4 rounded-2xl border border-white/5 mt-2">
                <p class="text-center text-xs text-gray-400 font-bold uppercase tracking-wider mb-2">Mudar Fundo</p>
                <div class="flex gap-3 justify-center">
                    <button onclick="mudarCor('cinza')" class="w-6 h-6 rounded-full bg-gray-800 border border-white/20"></button>
                    <button onclick="mudarCor('marrom')" class="w-6 h-6 rounded-full bg-[#A04000] border border-white/20"></button>
                    <button onclick="mudarCor('azul')" class="w-6 h-6 rounded-full bg-blue-900 border border-white/20"></button>
                    <button onclick="mudarCor('foto')" class="w-6 h-6 rounded-full bg-cover border border-white/20" style="background-image: url('ubatuba.jpg');"></button>
                </div>
            </div>
        </div>
        
        <!-- TABELA PRINCIPAL -->
        <div class="w-full md:w-2/3 flex flex-col gap-6">
            <div class="bg-gray-900/80 p-6 rounded-2xl shadow-xl border border-white/5 overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="text-gray-400 text-xs uppercase border-b border-white/10">
                        <tr>
                            <th class="pb-3">Foto</th>
                            <th class="pb-3">Morador</th>
                            <th class="pb-3">Endereço</th>
                            <th class="pb-3">Empresa</th>
                            <th class="pb-3">Tipo</th>
                            <th class="pb-3">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaEncomendas" class="divide-y divide-white/10"></tbody>
                </table>
            </div>

            <!-- Área de Histórico (mantendo a visualização da foto salva anteriormente) -->
            <div id="areaHistorico" class="bg-[#A04000]/90 p-6 rounded-2xl border border-white/10 shadow-xl hidden">
                <h2 class="text-xl font-bold mb-4">Histórico de Entregas Recentes</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="text-white/60 uppercase border-b border-white/20">
                            <tr>
                                <th class="pb-2">Foto</th>
                                <th class="pb-2">Morador/Endereço</th>
                                <th class="pb-2">Empresa/Tipo</th>
                                <th class="pb-2">Recebedor</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaHistoricoCorpo" class="divide-y divide-white/10"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="./logica.js"></script>
</body>
</html>
