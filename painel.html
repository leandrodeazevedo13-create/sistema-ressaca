<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#A04000] text-white min-h-screen p-4">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold text-center mb-6">PAINEL RESSACA</h1>
        
        <button onclick="document.getElementById('modal').style.display='flex'" 
                class="bg-blue-600 px-4 py-2 rounded font-bold mb-4">NOVA ENCOMENDA</button>

        <div class="bg-gray-800 p-4 rounded shadow">
            <table class="w-full text-left text-sm">
                <thead>
                    <tr class="text-gray-400 border-b border-gray-700">
                        <th class="pb-2">Unid</th>
                        <th class="pb-2">Empresa</th>
                        <th class="pb-2">Cod</th>
                        <th class="pb-2">Ação</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela"></tbody>
            </table>
        </div>
    </div>

    <div id="modal" style="display:none" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-gray-900 p-6 rounded w-full max-w-sm">
            <input type="text" id="unid" placeholder="Unidade" class="w-full p-2 mb-2 bg-gray-800 rounded">
            <input type="text" id="emp" placeholder="Empresa" class="w-full p-2 mb-2 bg-gray-800 rounded">
            <input type="text" id="cod" placeholder="Código" class="w-full p-2 mb-4 bg-gray-800 rounded">
            <button onclick="salvar()" class="w-full bg-green-600 p-2 rounded font-bold">SALVAR</button>
            <button onclick="document.getElementById('modal').style.display='none'" class="w-full bg-red-600 p-2 rounded mt-2 font-bold">FECHAR</button>
        </div>
    </div>

    <script>
        // Inicialização Única
        const sb = supabase.createClient(
            'https://oreltmkohfzptelcqmau.supabase.co', 
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9yZWx0bWtvaGZ6cHRlbGNxbWF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTc0NTMsImV4cCI6MjA5NTY3MzQ1M30.cZUui1XdJ1m1qwivtDiR_3-byxnLU5ZwHffSv2tyrCQ'
        );

        async function carregar() {
            const { data } = await sb.from('encomendas').select('*');
            document.getElementById('corpoTabela').innerHTML = data.map(i => `
                <tr class="border-b border-gray-700">
                    <td class="py-2">${i.unidade}</td>
                    <td class="py-2">${i.empresa}</td>
                    <td class="py-2">${i.codigo}</td>
                    <td class="py-2"><button onclick="deletar('${i.id}')" class="bg-red-500 px-2 rounded text-xs">X</button></td>
                </tr>
            `).join('');
        }

        async function salvar() {
            await sb.from('encomendas').insert([{
                unidade: document.getElementById('unid').value,
                empresa: document.getElementById('emp').value,
                codigo: document.getElementById('cod').value
            }]);
            location.reload(); // Recarrega para limpar tudo e evitar erros
        }

        async function deletar(id) {
            await sb.from('encomendas').delete().eq('id', id);
            location.reload();
        }

        carregar();
    </script>
</body>
</html>
