<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Painel Ressaca - Portaria</title>
    <style>
        .theme-light { background-color: #ffffff !important; color: #000000 !important; }
        .theme-light .bg-gray-800 { background-color: #e5e7eb !important; color: #000000 !important; }
        .theme-light .text-white { color: #000000 !important; }
    </style>
</head>
<body id="pageBody" class="min-h-screen p-4 md:p-8 text-white transition-colors duration-300 bg-cover bg-center" style="background-image: url('ubatuba.jpg'); background-color: #A04000;">

    <audio id="audioPlayer" loop><source src="https://stream.eldorado.fm/eldorado" type="audio/mpeg"></audio>

    <div id="modalEncomenda" class="hidden fixed inset-0 z-[100] bg-black/60 flex items-center justify-center p-4">
        <div class="bg-gray-900 p-8 rounded-2xl w-full max-w-md border border-white/10">
            <h2 class="text-xl font-bold mb-4">Nova Encomenda</h2>
            <input type="text" id="in-cod" placeholder="Código" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none">
            <input type="text" id="in-morador-nome" placeholder="Nome do Morador" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none">
            <input type="text" id="in-endereco" placeholder="Endereço" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none">
            <input type="text" id="in-empresa" placeholder="Empresa" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none">
            <input type="text" id="in-tipo" placeholder="Tipo" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none">
            <input type="file" id="in-foto" accept="image/*" capture="environment" class="w-full p-3 mb-4 bg-gray-800 rounded-lg text-sm">
            <div class="flex gap-2">
                <button id="btnSalvarEncomenda" class="flex-1 bg-green-600 p-3 rounded-lg font-bold">Salvar</button>
                <button onclick="document.getElementById('modalEncomenda').classList.add('hidden')" class="flex-1 bg-red-600 p-3 rounded-lg">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalEntrega" class="hidden fixed inset-0 z-[100] bg-black/60 flex items-center justify-center p-4">
        <div class="bg-gray-900 p-8 rounded-2xl w-full max-w-sm border border-white/10">
            <h2 class="text-xl font-bold mb-4">Confirmar Entrega</h2>
            <input type="text" id="in-recebedor" placeholder="Nome do Recebedor" class="w-full p-3 mb-2 bg-gray-800 rounded-lg outline-none">
            <button id="btnConfirmarEntrega" class="w-full bg-green-600 p-3 rounded-lg font-bold">Confirmar</button>
        </div>
    </div>

    <header class="max-w-6xl mx-auto mb-8 text-center"><h1 class="text-3xl font-bold uppercase tracking-widest">ASSOCIAÇÃO MORADORES BAIRRO RESSACA 🏄‍♂️</h1></header>

    <div class="max-w-6xl mx-auto flex flex-col md:flex-row gap-6">
        <div class="w-full md:w-1/3 flex flex-col gap-4">
            <button onclick="document.getElementById('modalEncomenda').classList.remove('hidden')" class="bg-blue-600 p-6 rounded-2xl font-bold">+ NOVA ENCOMENDA</button>
            <button onclick="alert('Cadastro de Usuário em Breve')" class="bg-gray-600 p-6 rounded-2xl font-bold">+ CADASTRAR USUÁRIO</button>
            <button onclick="togglePlay()" class="bg-gray-600 p-4 rounded-2xl font-bold"><span id="playIcon">▶</span> OUVIR RÁDIO</button>
            <button onclick="carregarHistorico()" class="bg-purple-700 p-4 rounded-2xl font-bold">📜 HISTÓRICO DE ENTREGAS</button>
        </div>
        
        <div class="w-full md:w-2/3 flex flex-col gap-6 overflow-x-auto">
            <div class="bg-gray-800 p-6 rounded-2xl shadow-xl">
                <table class="w-full text-left">
                    <thead class="text-gray-400 text-xs uppercase border-b border-white/10">
                        <tr><th class="pb-3">Foto</th><th class="pb-3">Morador</th><th class="pb-3">Endereço</th><th class="pb-3">Empresa</th><th class="pb-3">Tipo</th><th class="pb-3">Ação</th></tr>
                    </thead>
                    <tbody id="tabelaEncomendas" class="divide-y divide-white/10"></tbody>
                </table>
            </div>
            <div id="areaHistorico" class="bg-[#A04000] p-6 rounded-2xl hidden">
                <h2 class="text-xl font-bold mb-4">Histórico de Entregas</h2>
                <div id="tabelaHistorico" class="text-xs"></div>
            </div>
        </div>
    </div>
    <script type="module" src="./logica.js"></script>
</body>
</html>
