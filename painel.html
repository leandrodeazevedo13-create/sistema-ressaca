<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>Painel Ressaca</title>
</head>
<body class="bg-[#A04000] text-white min-h-screen">

    <div class="max-w-6xl mx-auto p-6">
        <header class="mb-8 text-center">
            <h1 class="text-2xl font-bold uppercase tracking-widest">ASSOCIAÇÃO MORADORES BAIRRO RESSACA</h1>
        </header>

        <div class="flex gap-6">
            <div class="w-1/3 flex flex-col gap-4">
                <button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-blue-600 p-4 rounded-xl font-bold hover:bg-blue-700">NOVA ENCOMENDA</button>
            </div>

            <div class="w-2/3 bg-gray-800 p-6 rounded-2xl shadow-xl">
                <table class="w-full text-left">
                    <thead class="text-gray-400 text-xs uppercase border-b border-white/10">
                        <tr><th class="pb-3">Unid</th><th class="pb-3">Empresa</th><th class="pb-3">Código</th><th class="pb-3">Ação</th></tr>
                    </thead>
                    <tbody id="tabelaEncomendas" class="divide-y divide-white/10"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
        <div class="bg-gray-900 p-6 rounded-2xl w-80">
            <input type="text" id="in-unid" placeholder="Unidade" class="w-full p-2 mb-2 bg-gray-800 rounded">
            <input type="text" id="in-emp" placeholder="Empresa" class="w-full p-2 mb-2 bg-gray-800 rounded">
            <input type="text" id="in-cod" placeholder="Código" class="w-full p-2 mb-4 bg-gray-800 rounded">
            <button onclick="salvar()" class="w-full bg-green-600 p-2 rounded">Salvar</button>
        </div>
    </div>

    <script>
        // Inicialização Única
        const supabase = supabase.createClient('https://oreltmkohfzptelcqmau.supabase.co', 'SUA_CHAVE_ANON_AQUI');

        async function carregar() {
            const { data } = await supabase.from('encomendas').select('*');
            const tbody = document.getElementById('tabelaEncomendas');
            tbody.innerHTML = data?.map(i => `
                <tr class="text-xs">
                    <td class="py-3">${i.unidade}</td>
                    <td class="py-3">${i.empresa}</td>
                    <td class="py-3">${i.codigo}</td>
                    <td class="py-3"><button onclick="entregar('${i.id}')" class="bg-green-600 px-2 rounded">OK</button></td>
                </tr>`).join('') || '';
        }

        async function salvar() {
            await supabase.from('encomendas').insert([{
                unidade: document.getElementById('in-unid').value,
                empresa: document.getElementById('in-emp').value,
                codigo: document.getElementById('in-cod').value
            }]);
            document.getElementById('modal').classList.add('hidden');
            carregar();
        }

        carregar();
    </script>
</body>
</html>
