<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Painel Ressaca - Portaria</title>
    <style>
        .theme-light { background-color: #ffffff !important; color: #000000 !important; }
        .theme-light .bg-gray-800 { background-color: #e5e7eb !important; color: #000000 !important; }
        .theme-light .text-white { color: #000000 !important; }
        .theme-light .text-gray-400 { color: #4b5563 !important; }
        .theme-light .bg-gray-900 { background-color: #d1d5db !important; }
    </style>
</head>
<body id="pageBody" class="bg-[#A04000] min-h-screen p-8 text-white transition-colors duration-300">

    <audio id="audioRadio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>

    <button id="playBtn" onclick="togglePlay()" 
        class="fixed top-6 right-20 w-16 h-16 rounded-full bg-gradient-to-br from-gray-400 to-gray-600 border border-white/10 shadow-[0_8px_15px_rgba(0,0,0,0.5)] active:translate-y-1 z-50 flex items-center justify-center">
        <span id="playIcon" class="text-3xl">▶</span>
    </button>

    <div class="fixed right-6 top-6 flex flex-col gap-2 bg-black/20 p-2 rounded-full z-50">
        <button onclick="mudarCor('#A04000')" class="w-5 h-5 rounded-full bg-[#A04000]"></button>
        <button onclick="mudarCor('#374151')" class="w-5 h-5 rounded-full bg-gray-700"></button>
        <button onclick="document.body.classList.toggle('theme-light')" class="w-5 h-5 rounded-full bg-white border border-black"></button>
    </div>

    <a href="#" class="fixed bottom-8 left-8 bg-green-500 p-6 rounded-full shadow-[0_10px_20px_rgba(0,0,0,0.3)] z-50">💬</a>

    <header class="max-w-6xl mx-auto mb-8 text-center">
        <h1 class="text-3xl font-bold uppercase tracking-widest">ASSOCIAÇÃO MORADORES BAIRRO RESSACA 🏄‍♂️</h1>
    </header>

    <div class="max-w-6xl mx-auto flex gap-6">
        <div class="w-1/3 flex flex-col gap-4">
            <button class="bg-blue-600 p-6 rounded-2xl font-bold hover:bg-blue-700">+ NOVA ENCOMENDA</button>
            <button class="bg-gray-600 p-6 rounded-2xl font-bold hover:bg-gray-700">+ CADASTRAR USUÁRIO</button>
        </div>

        <div class="w-2/3 bg-gray-800 p-6 rounded-2xl shadow-xl">
            <div class="mb-6 flex items-center bg-gray-900 px-4 py-3 rounded-xl border border-white/10">
                <span class="mr-3">🔍</span>
                <input type="text" placeholder="Pesquisar..." class="bg-transparent outline-none w-full">
            </div>

            <div class="max-h-[500px] overflow-y-auto">
                <table class="w-full text-left">
                    <thead class="text-gray-400 text-xs uppercase border-b border-white/10 sticky top-0 bg-gray-800">
                        <tr><th class="pb-3">Unid</th><th class="pb-3">Logradouro</th><th class="pb-3">Empresa</th><th class="pb-3">Chegada</th><th class="pb-3">Código</th><th class="pb-3">Ação</th></tr>
                    </thead>
                    <tbody id="tabelaEncomendas" class="divide-y divide-white/10"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const encomendas = [
            {u: '101', l: 'R. Pescada', e: '📦 ML', c: '29/05', cod: 'PCP-01'},
            {u: '102', l: 'R. Badéjo', e: '🚚 Correios', c: '29/05', cod: 'PCP-02'},
            {u: '103', l: 'R. Tainha', e: '🛍 Shopee', c: '28/05', cod: 'PCP-03'},
            {u: '201', l: 'R. Pescada', e: '📦 ML', c: '28/05', cod: 'PCP-04'},
            {u: '202', l: 'R. Badéjo', e: '🚚 Correios', c: '27/05', cod: 'PCP-05'},
            {u: '203', l: 'R. Tainha', e: '📦 ML', c: '27/05', cod: 'PCP-06'},
            {u: '301', l: 'R. Pescada', e: '🛍 Shopee', c: '26/05', cod: 'PCP-07'},
            {u: '302', l: 'R. Badéjo', e: '🚚 Correios', c: '26/05', cod: 'PCP-08'},
            {u: '303', l: 'R. Tainha', e: '📦 ML', c: '25/05', cod: 'PCP-09'},
            {u: '401', l: 'R. Pescada', e: '🛍 Shopee', c: '25/05', cod: 'PCP-10'},
            {u: '402', l: 'R. Badéjo', e: '🚚 Correios', c: '24/05', cod: 'PCP-11'},
            {u: '403', l: 'R. Tainha', e: '📦 ML', c: '24/05', cod: 'PCP-12'},
            {u: '501', l: 'R. Pescada', e: '🚚 Correios', c: '23/05', cod: 'PCP-13'},
            {u: '502', l: 'R. Badéjo', e: '📦 ML', c: '23/05', cod: 'PCP-14'},
            {u: '503', l: 'R. Tainha', e: '🛍 Shopee', c: '22/05', cod: 'PCP-15'},
            {u: '601', l: 'R. Pescada', e: '🚚 Correios', c: '22/05', cod: 'PCP-16'},
            {u: '602', l: 'R. Badéjo', e: '📦 ML', c: '21/05', cod: 'PCP-17'},
            {u: '603', l: 'R. Tainha', e: '🛍 Shopee', c: '21/05', cod: 'PCP-18'},
            {u: '701', l: 'R. Pescada', e: '🚚 Correios', c: '20/05', cod: 'PCP-19'},
            {u: '702', l: 'R. Badéjo', e: '📦 ML', c: '20/05', cod: 'PCP-20'}
        ];

        const corpo = document.getElementById('tabelaEncomendas');
        encomendas.forEach(item => {
            corpo.innerHTML += `<tr class="text-sm"><td class="py-3 font-bold">${item.u}</td><td class="py-3">${item.l}</td><td class="py-3 font-bold text-yellow-400">${item.e}</td><td class="py-3">${item.c}</td><td class="py-3 font-mono">${item.cod}</td><td class="py-3"><button class="bg-green-600 px-3 py-1 rounded-lg hover:bg-green-700">Entregar</button></td></tr>`;
        });

        function mudarCor(c) { document.getElementById('pageBody').style.backgroundColor = c; }
        function togglePlay() { 
            const audio = document.getElementById('audioRadio');
            const icon = document.getElementById('playIcon');
            if (audio.paused) { audio.play(); icon.innerText = '⏸'; } 
            else { audio.pause(); icon.innerText = '▶'; }
        }
    </script>
</body>
</html>
