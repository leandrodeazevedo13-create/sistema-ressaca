<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Painel Ressaca - Profissional</title>
    <style>
        .theme-light { background-color: #ffffff !important; color: #000000 !important; }
        .theme-light .bg-gray-800 { background-color: #e5e7eb !important; color: #000000 !important; }
        .theme-light .text-white { color: #000000 !important; }
        .theme-light .text-gray-400 { color: #4b5563 !important; }
    </style>
</head>
<body id="pageBody" class="bg-gray-700 min-h-screen p-6 font-sans text-white transition-colors duration-300">

    <div class="fixed right-6 top-6 flex flex-col items-center gap-4 z-50">
        <button onclick="togglePlay()" class="w-16 h-16 rounded-full bg-gradient-to-b from-gray-400 to-gray-600 border border-white/20 shadow-[0_6px_0_#1f2937] active:shadow-none active:translate-y-1 transition-all">▶</button>
        <div class="flex flex-col gap-2 bg-black/20 p-2 rounded-full">
            <button onclick="mudarCor('#374151')" class="w-5 h-5 rounded-full bg-gray-700"></button>
            <button onclick="mudarCor('#1e3a8a')" class="w-5 h-5 rounded-full bg-blue-900"></button>
            <button onclick="mudarCor('#065f46')" class="w-5 h-5 rounded-full bg-green-900"></button>
            <button onclick="document.body.classList.toggle('theme-light')" class="w-5 h-5 rounded-full bg-white border border-black"></button>
        </div>
    </div>

    <header class="max-w-5xl mx-auto mb-8">
        <h1 class="text-3xl font-bold uppercase">Associação Bairro Ressaca</h1>
    </header>

    <div class="max-w-5xl mx-auto bg-gray-800 p-6 rounded-2xl shadow-xl">
        
        <div class="mb-6 flex items-center bg-gray-900 px-4 py-3 rounded-xl border border-white/10">
            <span class="mr-3">🔍</span>
            <input type="text" placeholder="Pesquisar encomenda..." class="bg-transparent outline-none w-full">
        </div>

        <table class="w-full text-left">
            <thead class="text-gray-400 text-xs uppercase border-b border-white/10">
                <tr>
                    <th class="pb-3">Unid</th>
                    <th class="pb-3">Logradouro</th>
                    <th class="pb-3">Status</th>
                    <th class="pb-3">Código</th>
                    <th class="pb-3">Ação</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-white/10">
                <tr class="text-sm">
                    <td class="py-4 font-bold">103</td>
                    <td class="py-4">Rua Pescada</td>
                    <td class="py-4 text-green-400">Disponível</td>
                    <td class="py-4 font-mono">PCP-88</td>
                    <td class="py-4"><button class="bg-green-600 px-4 py-1 rounded-lg font-bold hover:bg-green-700">Entregar</button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        function mudarCor(cor) { document.getElementById('pageBody').style.backgroundColor = cor; }
        function togglePlay() { alert('Rádio Ressaca: Transmitindo...'); }
    </script>
</body>
</html>
