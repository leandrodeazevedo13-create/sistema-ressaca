<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Associação Bairro Ressaca</title>
</head>
<body class="bg-[#FF6600] min-h-screen p-6 font-sans">

    <header class="max-w-6xl mx-auto mb-6 flex flex-col items-center justify-center text-white">
        <div class="flex items-center gap-3">
            <span class="text-4xl">🏄‍♂️</span>
            <h1 class="text-3xl font-bold tracking-tight">ASSOCIAÇÃO MORADORES BAIRRO RESSACA</h1>
        </div>
        <div class="mt-4 w-full max-w-2xl bg-blue-500/30 border border-white/20 p-2 rounded-lg text-sm text-center">
            ⚠️ **Aviso:** Portão principal em manutenção na terça-feira.
        </div>
    </header>

    <div class="max-w-6xl mx-auto flex gap-6">
        
        <div class="w-1/3 bg-white p-6 rounded-2xl shadow-xl h-fit">
            <button class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold hover:bg-blue-700 transition mb-4 shadow-md">
                + NOVA ENCOMENDA
            </button>
            
            <button class="w-full bg-gray-600 text-white py-4 rounded-xl font-bold hover:bg-gray-700 transition mb-6 shadow-md">
                + CADASTRAR USUÁRIO
            </button>

            <div class="space-y-3">
                <h2 class="text-xs font-bold text-gray-500 uppercase">Solicitações Pendentes</h2>
                <div class="bg-gray-100 p-3 rounded-lg text-sm border-l-4 border-gray-300">Ana (Unid. 301) - Validar</div>
            </div>
        </div>

        <div class="w-2/3 bg-white p-6 rounded-2xl shadow-xl">
            <div class="mb-6"><input type="text" placeholder="🔍 Buscar morador ou rua..." class="w-full bg-gray-50 border-2 border-gray-200 p-3 rounded-xl focus:border-orange-500 outline-none"></div>
            
            <div class="overflow-y-auto max-h-[500px]">
                <table class="w-full text-left">
                    <thead class="text-gray-400 text-xs uppercase">
                        <tr>
                            <th class="pb-3">Unidade</th>
                            <th class="pb-3">Morador/Rua</th>
                            <th class="pb-3">Código</th>
                            <th class="pb-3">Status</th>
                            <th class="pb-3">Ação</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y">
                        <tr class="text-sm">
                            <td class="py-4 font-bold">Unid. 103</td>
                            <td class="py-4">R. Pescada</td>
                            <td class="py-4 font-mono font-bold text-red-600">PCP-88</td>
                            <td class="py-4 text-[10px] font-bold text-red-600 uppercase">7+ dias</td>
                            <td class="py-4"><button class="bg-green-600 text-white px-4 py-1.5 rounded-lg font-bold hover:bg-green-700">Entregar</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <a href="https://wa.me/SEUNUMERO" target="_blank" class="fixed bottom-8 right-8 bg-green-500 text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform">
        <span class="text-3xl">💬</span>
    </a>

</body>
</html>
