<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Painel Ressaca</title>
</head>
<body id="pageBody" class="bg-gray-700 min-h-screen p-6 font-sans transition-colors duration-500 text-white">

    <div class="fixed right-6 top-6 flex flex-col items-center gap-4">
        
        <button id="playBtn" onclick="togglePlay()" class="w-16 h-16 rounded-full bg-gradient-to-b from-gray-400 to-gray-600 border border-white/20 shadow-[0_6px_0_#1f2937] active:shadow-none active:translate-y-1 transition-all flex items-center justify-center">
            <span id="playIcon" class="text-3xl text-white drop-shadow-md">▶</span>
        </button>

        <div class="flex flex-col gap-2 bg-black/20 p-2 rounded-full">
            <button onclick="mudarCor('#FF6600')" class="w-5 h-5 rounded-full bg-[#FF6600]/80"></button>
            <button onclick="mudarCor('#374151')" class="w-5 h-5 rounded-full bg-gray-700/80"></button>
            <button onclick="mudarCor('#1e3a8a')" class="w-5 h-5 rounded-full bg-blue-900/80"></button>
            <button onclick="mudarCor('#065f46')" class="w-5 h-5 rounded-full bg-green-900/80"></button>
            <button onclick="mudarCor('#7c2d12')" class="w-5 h-5 rounded-full bg-orange-900/80"></button>
        </div>
    </div>

    <a href="#" class="fixed bottom-8 left-8 bg-green-500 p-6 rounded-full shadow-[0_10px_0_rgb(6,95,70)] active:shadow-none active:translate-y-2 transition-all">
        <span class="text-3xl">💬</span>
    </a>

    <header class="max-w-4xl mx-auto mb-8 text-center">
        <h1 class="text-3xl font-bold tracking-tight">ASSOCIAÇÃO MORADORES BAIRRO RESSACA 🏄‍♂️</h1>
    </header>

    <div class="max-w-4xl mx-auto flex gap-6">
        <div class="w-1/3 bg-gray-900/40 backdrop-blur-sm p-6 rounded-2xl border border-white/10">
            <button class="w-full bg-blue-600 py-4 rounded-xl font-bold mb-4 hover:bg-blue-700 shadow-lg">+ NOVA ENCOMENDA</button>
            <button class="w-full bg-gray-600 py-4 rounded-xl font-bold hover:bg-gray-700 shadow-lg">+ CADASTRAR USUÁRIO</button>
        </div>
        <div class="w-2/3 bg-gray-900/40 backdrop-blur-sm p-6 rounded-2xl border border-white/10">
            <table class="w-full text-left">
                <thead><tr class="text-gray-400 text-xs uppercase"><th class="pb-3">Unid</th><th class="pb-3">Morador</th><th class="pb-3">Ação</th></tr></thead>
                <tbody class="divide-y divide-white/10">
                    <tr class="text-sm">
                        <td class="py-4">103</td>
                        <td class="py-4">R. Pescada</td>
                        <td class="py-4"><button class="bg-green-600 px-4 py-1 rounded-lg font-bold hover:bg-green-700">Entregar</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function mudarCor(cor) { document.getElementById('pageBody').style.backgroundColor = cor; }
        function togglePlay() {
            const icon = document.getElementById('playIcon');
            icon.innerText = icon.innerText === '▶' ? '⏸' : '▶';
        }
    </script>
</body>
</html>
