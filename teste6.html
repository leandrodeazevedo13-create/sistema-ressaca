<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Painel Ressaca - Grid View</title>
</head>
<body id="pageBody" class="bg-gray-700 min-h-screen p-8 text-white transition-colors duration-500">

    <div class="fixed right-6 top-6 flex flex-col items-center gap-4 z-50">
        <button onclick="togglePlay()" class="w-16 h-16 rounded-full bg-gradient-to-b from-gray-400 to-gray-600 border border-white/20 shadow-[0_6px_0_#1f2937] active:shadow-none active:translate-y-1 transition-all">▶</button>
        <div class="flex flex-col gap-2 bg-black/20 p-2 rounded-full">
            <button onclick="mudarCor('#374151')" class="w-5 h-5 rounded-full bg-gray-700"></button>
            <button onclick="mudarCor('#1e3a8a')" class="w-5 h-5 rounded-full bg-blue-900"></button>
            <button onclick="mudarCor('#065f46')" class="w-5 h-5 rounded-full bg-green-900"></button>
        </div>
    </div>

    <a href="#" class="fixed bottom-8 left-8 bg-green-500 p-6 rounded-full shadow-[0_10px_0_rgb(6,95,70)] active:shadow-none active:translate-y-2 z-50">💬</a>

    <header class="mb-10">
        <h1 class="text-4xl font-bold uppercase tracking-tighter">Associação Ressaca</h1>
        <p class="text-gray-400 text-sm">Gestão de Encomendas & Moradores</p>
    </header>

    <div class="mb-8 flex items-center bg-gray-800 p-4 rounded-xl border border-white/10 w-full max-w-lg">
        <span class="mr-3 text-gray-400 text-xl">🔍</span>
        <input type="text" placeholder="Filtrar por unidade ou morador..." class="bg-transparent outline-none w-full placeholder-gray-500">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        
        <div class="bg-gray-800 p-6 rounded-3xl border border-white/5 shadow-2xl hover:border-blue-500 transition-all">
            <div class="flex justify-between items-start mb-4">
                <span class="text-xs font-bold bg-blue-900/50 px-3 py-1 rounded-full">UNID 103</span>
                <span class="text-sm font-bold text-green-400">PCP-88</span>
            </div>
            <h3 class="text-xl font-bold mb-1">Rua Pescada</h3>
            <p class="text-sm text-gray-400 mb-6">Chegou: 28/05 - 14:15</p>
            
            <button class="w-full bg-green-600 py-3 rounded-xl font-bold hover:bg-green-700 active:scale-95 transition-all">
                ENTREGAR
            </button>
        </div>

    </div>

    <script>
        function mudarCor(cor) { document.getElementById('pageBody').style.backgroundColor = cor; }
        function togglePlay() { alert('Rádio Ressaca Iniciada!'); }
    </script>
</body>
</html>
