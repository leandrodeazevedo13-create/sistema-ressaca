<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Painel Ressaca</title>
</head>
<body id="pageBody" class="bg-[#FF6600] min-h-screen p-6 font-sans transition-colors duration-500">

    <div class="fixed right-6 top-1/2 -translate-y-1/2 flex flex-col gap-3">
        <button onclick="mudarCor('#FF6600')" class="w-6 h-6 rounded-full bg-[#FF6600]/80 border border-white/30"></button>
        <button onclick="mudarCor('#374151')" class="w-6 h-6 rounded-full bg-gray-700/80 border border-white/30"></button>
        <button onclick="mudarCor('#1e3a8a')" class="w-6 h-6 rounded-full bg-blue-900/80 border border-white/30"></button>
        <button onclick="mudarCor('#065f46')" class="w-6 h-6 rounded-full bg-green-900/80 border border-white/30"></button>
        <button onclick="mudarCor('#7c2d12')" class="w-6 h-6 rounded-full bg-orange-900/80 border border-white/30"></button>
    </div>

    <a href="#" class="fixed bottom-8 left-8 bg-green-500 p-6 rounded-full shadow-[0_10px_0_rgb(6,95,70)] active:shadow-none active:translate-y-2 transition-all">
        <span class="text-3xl">💬</span>
    </a>

    <header class="max-w-4xl mx-auto mb-8 text-center text-white">
        <h1 class="text-3xl font-bold tracking-tight">ASSOCIAÇÃO MORADORES BAIRRO RESSACA 🏄‍♂️</h1>
    </header>

    <div class="max-w-4xl mx-auto flex gap-6">
        <div class="w-1/3 bg-gray-900/40 backdrop-blur-sm p-6 rounded-2xl border border-white/10 text-white">
            <button class="w-full bg-blue-600 py-4 rounded-xl font-bold mb-4 shadow-lg hover:bg-blue-700">+ NOVA ENCOMENDA</button>
            <button class="w-full bg-gray-600 py-4 rounded-xl font-bold hover:bg-gray-700">+ CADASTRAR USUÁRIO</button>
        </div>

        <div class="w-2/3 bg-gray-900/40 backdrop-blur-sm p-6 rounded-2xl border border-white/10 text-white">
            <table class="w-full text-left">
                <thead><tr class="text-gray-400 text-xs uppercase"><th class="pb-3">Unid</th><th class="pb-3">Morador</th><th class="pb-3">Ação</th></tr></thead>
                <tbody class="divide-y divide-white/10">
                    <tr class="text-sm">
                        <td class="py-4">103</td>
                        <td class="py-4">R. Pescada</td>
                        <td class="py-4"><button class="bg-green-600 px-4 py-1 rounded-lg font-bold hover:bg-green-700">Entregar</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function mudarCor(cor) { document.getElementById('pageBody').style.backgroundColor = cor; }
    </script>
</body>
</html>
